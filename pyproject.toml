[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blackhornet-colony"
version = "5.0.0"
description = "BlackHornet Living AGI Colony — self-improving, immortal, autonomous bee-colony system"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "BlackHornet Contributors"},
]
readme = "README.md"
keywords = ["agi", "colony", "agents", "multi-agent", "autonomous"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=1.10,<3",
    "requests>=2.31",
    "numpy>=1.24",
    "httpx>=0.25",
    "aiohttp>=3.9",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "websockets>=12.0",
    "yfinance>=0.2.30",
    "pandas>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/blackhornet/colony"
Repository = "https://github.com/blackhornet/colony"

[project.scripts]
bh-colony = "src.integration.unified_launcher:main"
bh-omega = "src.omega.cli:main"

[tool.setuptools.packages.find]
include = ["src*"]
exclude = ["tests*", "scripts*"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
api = [
    "prometheus_client>=0.19",
    "starlette>=0.36",
    "uvicorn>=0.27",
]
a2a = [
    "cryptography>=41.0",
]
